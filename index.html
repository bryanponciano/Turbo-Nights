const _mc=new Map();
function mix(a,b,t){const k=a+b+t;let v=_mc.get(k);if(v)return v;
  const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16);
  const f=s=>Math.round(((A>>s)&255)*(1-t)+((B>>s)&255)*t);
  v='#'+((1<<24)|(f(16)<<16)|(f(8)<<8)|f(0)).toString(16).slice(1);_mc.set(k,v);return v}
const _sc=new Map();
function shade(c,f){const k=c+'|'+f;let v=_sc.get(k);if(v)return v;
  const n=parseInt(c.slice(1),16);
  v='rgb('+((n>>16&255)*f|0)+','+((n>>8&255)*f|0)+','+((n&255)*f|0)+')';_sc.set(k,v);return v}
function px(x,y,w,h,c){const x0=Math.round(x),y0=Math.round(y),x1=Math.round(x+w),y1=Math.round(y+h);
  if(x1<=x0||y1<=y0)return;g.fillStyle=c;g.fillRect(x0,y0,x1-x0,y1-y0)}
function mk(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingEnabled=false;fn(x);return c}
function ln(x,x0,y0,x1,y1,col){x.fillStyle=col;const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))||1;
  for(let i=0;i<=n;i++)x.fillRect(Math.round(x0+(x1-x0)*i/n),Math.round(y0+(y1-y0)*i/n),1,1)}

  GC.set(k,c);return c}
function drawText(ctx,str,x,y,color,s,shadow,align){

  if(align==='center')x=Math.round(x-w/2);else if(align==='right')x=Math.round(x-w);
  const so=Math.max(1,Math.round(s/3));
  if(shadow)for(let i=0;i<str.length;i++)ctx.drawImage(glyph(str[i],shadow,s),x+i*4*s+so,y+so);
  for(let i=0;i<str.length;i++)ctx.drawImage(glyph(str[i],color,s),x+i*4*s,y)}

  const map={

    B:pal[0],
    D:pal[1],
    H:pal[2],
    O:brake?'#ffffff':pal[3],
    R:brake?'#ffffff':pal[4],
    E:wrecked?'#222':'#606870',
    T:tread?'#26262a':'#101014'

  return _cs[k]=mk(24,art.length,x=>{
    for(let y=0;y<art.length;y++)for(let i=0;i<24;i++){

      if(c!=='.'){x.fillStyle=map[c]||'#000';x.fillRect(i,y,1,1)}

  });
}

function spr(cnv,cx,by,s){

const CURVES=[],HILLS=[],OBJS=[];
function buildTrack(tr){
  CURVES.length=0;HILLS.length=0;
  let i=0;
  while(CURVES.length<NSEG){
    const [len,c]=tr.sections[i%tr.sections.length];i++;
    for(let j=0;j<len&&CURVES.length<NSEG;j++){
      const s=Math.sin(Math.PI*(j+.5)/len);
      CURVES.push(c*s*s);
    }
  }
  let hi=0;
  while(HILLS.length<NSEG){
    const [len,h]=tr.hills[hi%tr.hills.length];hi++;
    for(let j=0;j<len&&HILLS.length<NSEG;j++){
      const s=Math.sin(Math.PI*(j+.5)/len);
      HILLS.push(h*s);
    }
  }
}
function curveAt(z){const t=(((z%TRACK_LEN)+TRACK_LEN)%TRACK_LEN)/SEG,i=t|0,f=t-i;
  return CURVES[i]*(1-f)+CURVES[(i+1)%NSEG]*f}
function hillAt(z){const t=(((z%TRACK_LEN)+TRACK_LEN)%TRACK_LEN)/SEG,i=t|0,f=t-i;
  return HILLS[i]*(1-f)+HILLS[(i+1)%NSEG]*f}

    for(let z=80,i=0;z<TRACK_LEN;z+=160,i++){
      add(z,-1.32,SPR.lamp,1.6,true);add(z+80,1.32,SPR.lamp,1.6,true);
      if(i%11===5)add(z,(i%2?1:-1)*(2.1+rnd(i)*.6),BBS[i%5],1.5,false);
    }
  }else if(th==='harbor'){
    for(let z=80,i=0;z<TRACK_LEN;z+=240,i++){
      const sd=i%2?1:-1,xx=1.3+rnd(i*1.7)*.6;
      add(z,sd*xx,SPR.palm,1.7,xx<1.45);add(z+120,-sd*(1.35+rnd(i)*.9),SPR.palm,1.7,false);
      if(i%5===2)add(z+40,sd*(2.3),BBS[(i+1)%5],1.5,false);
      if(i%2===0)add(z+60,1.32*(i%4?1:-1),SPR.lamp,1.6,true);
    }
  }else if(th==='cyber'){
    for(let z=60,i=0;z<TRACK_LEN;z+=140,i++){
      add(z,-1.3,SPR.cyberPillar,1.6,true);add(z,1.3,SPR.cyberPillar,1.6,true);
      if(i%7===3)add(z+70,(i%2?1:-1)*2.3,BBS[i%5],1.5,false);
    }
  }else{
    for(let z=60,i=0;z<TRACK_LEN;z+=190,i++){
      const sd=rnd(i*2.3)>.5?1:-1,xx=1.3+rnd(i*5.1)*1.7;
      add(z,sd*xx,SPR.cactus,1.6,xx<1.45);if(rnd(i*9)>.5)add(z+95,-sd*(1.4+rnd(i*4)*1.8),SPR.cactus,1.4,false);
      if(i%9===4)add(z+30,sd*2.3,BBS[i%5],1.5,false);
    }
  }

  OBJS.sort((a,b)=>a.z-b.z);
}

/* ---------------------------------------------------------------------
   Cenário (Skyline / Montanhas)
   --------------------------------------------------------------------- */
function cityLayer(x,seed,minH,maxH,bcol,ecol,wcols,dens,gapMax){
  let cx=0,i=0;
  while(cx<512){
    let w=7+Math.floor(rnd(seed+i)*12);if(cx+w>512-3)w=512-cx;
    const h=minH+Math.floor(rnd(seed+i+77)*(maxH-minH));
    x.fillStyle=bcol;x.fillRect(cx,BASE_HOR-h,w,h);
    x.fillStyle=ecol;x.fillRect(cx,BASE_HOR-h,w,1);
    for(let yy=BASE_HOR-h+3;yy<BASE_HOR-2;yy+=3)for(let xx=cx+2;xx<cx+w-1;xx+=3){
      if(rnd(xx*7.3+yy*13.1+seed)<dens){
        x.fillStyle=wcols[Math.floor(rnd(xx+yy*3.7)*wcols.length)];
        x.fillRect(xx,yy,1,2);
      }
    }
    if(rnd(seed+i+9)>.72){
      x.fillStyle=ecol;x.fillRect(cx+(w>>1),BASE_HOR-h-5,1,5);
      x.fillStyle='#ff3030';x.fillRect(cx+(w>>1),BASE_HOR-h-6,1,1);
    }
    cx+=w+Math.floor(rnd(seed+i+3)*(gapMax+1));i++;
  }
}
function mountLayer(x,base,amp,col,edge,seed){
  for(let p=0;p<512;p++){
    const t=p*2*Math.PI/512;
    const h=base+amp*(0.5*Math.sin(3*t+seed)+0.3*Math.sin(7*t+seed*2)+0.2*Math.sin(17*t+seed*3)+0.1*Math.sin(41*t+seed));
    const hh=Math.max(4,Math.round(h));
    x.fillStyle=col;x.fillRect(p,BASE_HOR-hh,1,hh);
    x.fillStyle=edge;x.fillRect(p,BASE_HOR-hh,1,1);
  }
}
const _scenes={};
function getScene(idx){
  if(_scenes[idx])return _scenes[idx];
  const tr=TRACKS[idx],th=THEMES[tr.theme];
  const sky=mk(W,BASE_HOR+20,x=>{
    for(let y=0;y<BASE_HOR+20;y+=4){x.fillStyle=mix(th.skyTop,th.skyBot,Math.pow(y/(BASE_HOR+20),1.6));x.fillRect(0,y,W,4)}
    for(let i=0;i<70;i++){const sx=Math.floor(rnd(i*2.1)*W),sy=Math.floor(rnd(i*3.7)*(BASE_HOR)*(th.cel==='sun'?.45:.65));
      x.fillStyle=rnd(i*5.5)>.7?'#9cf':'#fff';x.fillRect(sx,sy,1,1)}
    if(th.cel==='moon'){
      const mx=186,my=22,r=10;
      for(let dy=-r;dy<=r;dy++){const w=Math.floor(Math.sqrt(r*r-dy*dy));x.fillStyle='#e8ecff';x.fillRect(mx-w,my+dy,w*2+1,1)}
      x.fillStyle='#b4bbe0';x.fillRect(mx-4,my-4,3,2);x.fillRect(mx+2,my+1,3,3);x.fillRect(mx-3,my+4,2,2);
    }else{
      const cx=W/2,cy=BASE_HOR-14,r=36;
      for(let dy=-r;dy<=0;dy++){const w=Math.floor(Math.sqrt(r*r-dy*dy)),yy=cy+dy;
        if(dy>-14&&((yy)%5<2))continue;
        x.fillStyle=mix('#ffe040','#ff2a8a',(dy+r)/r*1.0>1?1:(dy+r)/r);x.fillRect(cx-w,yy,w*2+1,1);
      }
    }
  });
  const far=mk(512,BASE_HOR+20,x=>{
    if(tr.theme==='desert'||tr.theme==='inferno')mountLayer(x,30,26,th.bFar,th.edgeFar,1.3);
    else cityLayer(x,11+idx,10,48,th.bFar,th.edgeFar,th.win,.14,tr.theme==='harbor'?10:1);
  });
  const near=mk(512,BASE_HOR+20,x=>{
    if(tr.theme==='desert'||tr.theme==='inferno')mountLayer(x,16,14,th.bNear,th.edgeNear,4.1);
    else cityLayer(x,50+idx*7,18,tr.theme==='harbor'?58:76,th.bNear,th.edgeNear,th.win,tr.theme==='harbor'?.38:.55,tr.theme==='harbor'?22:2);
  });
  return _scenes[idx]={sky,far,near};
}
function tile(c,vx,vy){
  const o=((Math.floor(vx)%512)+512)%512;
  const yo=Math.round(vy);
  g.drawImage(c,-o,yo);g.drawImage(c,512-o,yo);
}

/* ---------------------------------------------------------------------
   Áudio Chiptune (WebAudio)
   --------------------------------------------------------------------- */
const AU={ctx:null,muted:false,track:-1,step:0,next:0,
 init(){if(this.ctx)return;
  try{const C=window.AudioContext||window.webkitAudioContext;const c=this.ctx=new C();
    this.master=c.createGain();this.master.gain.value=this.muted?0:0.5;this.master.connect(c.destination);
    this.mus=c.createGain();this.mus.gain.value=0.5;this.mus.connect(this.master);
    this.sfxG=c.createGain();this.sfxG.gain.value=0.8;this.sfxG.connect(this.master);
    const len=c.sampleRate,b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;this.noise=b;
    this.eo1=c.createOscillator();this.eo1.type='sawtooth';this.eo2=c.createOscillator();this.eo2.type='square';
    this.ef=c.createBiquadFilter();this.ef.type='lowpass';this.ef.frequency.value=400;
    this.eg=c.createGain();this.eg.gain.value=0;
    this.eo1.connect(this.ef);this.eo2.connect(this.ef);this.ef.connect(this.eg);this.eg.connect(this.sfxG);
    this.eo1.start();this.eo2.start();
    setInterval(()=>this.tick(),25);
  }catch(e){this.ctx=null}},
 mn(n){return 440*Math.pow(2,(n-69)/12)},
 note(f,t,dur,type,vol,dest,slide){const c=this.ctx;if(!c)return;
  const o=c.createOscillator(),gn=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  gn.gain.setValueAtTime(0.0001,t);gn.gain.linearRampToValueAtTime(vol,t+0.005);gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(gn);gn.connect(dest||this.sfxG);o.start(t);o.stop(t+dur+0.03)},
 nz(dur,vol,type,freq,t,dest){const c=this.ctx;if(!c)return;t=t||c.currentTime;
  const s=c.createBufferSource();s.buffer=this.noise;const f=c.createBiquadFilter();f.type=type;f.frequency.value=freq;
  const gn=c.createGain();gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f);f.connect(gn);gn.connect(dest||this.sfxG);s.start(t,Math.random()*.5);s.stop(t+dur+0.05)},
 setMusic(i){this.track=i;this.step=0;if(this.ctx)this.next=this.ctx.currentTime+0.06},
 stopMusic(){this.track=-1},
 tick(){const c=this.ctx;if(!c||this.track<0||c.state!=='running')return;
  const sd=60/TRACKS[this.track].music.bpm/4;
  if(this.next<c.currentTime-0.2)this.next=c.currentTime+0.05;
  while(this.next<c.currentTime+0.15){this.sched(this.step++,this.next);this.next+=sd}},
 sched(step,t){const m=TRACKS[this.track].music,sd=60/m.bpm/4,bar=(step>>4)&3,s=step&15,root=m.root+m.prog[bar],mn=this.mn;
  if(s%2===0){const pat=[0,0,12,0,7,0,12,7];this.note(mn(root+pat[(s>>1)&7]),t,sd*1.7,'triangle',0.6,this.mus)}
  if(s%4===0)this.note(150,t,0.13,'sine',0.9,this.mus,45);
  if(s%8===4)this.nz(0.13,0.3,'highpass',1800,t,this.mus);
  if(s%2===1)this.nz(0.04,0.1,'highpass',7000,t,this.mus);
  this.note(mn(root+12+m.chord[s%3]),t,sd*0.9,'square',0.04,this.mus);
  const v=bar&1,r=rnd(m.seed+v*17+s*3.1);
  if(s%2===0&&r>0.4){const idx=Math.floor(rnd(m.seed+v*5+s*1.7)*m.scale.length);
    this.note(mn(root+24+m.scale[idx]+(r>0.88?12:0)),t,sd*2.2,'square',0.08,this.mus)}},
 engine(speed,thr,on){const c=this.ctx;if(!c)return;const n=c.currentTime;
  this.eo1.frequency.setTargetAtTime(45+speed*1.15,n,.05);this.eo2.frequency.setTargetAtTime(22+speed*.58,n,.05);
  this.ef.frequency.setTargetAtTime(240+speed*5+thr*160,n,.08);
  this.eg.gain.setTargetAtTime(on?0.05+0.05*thr:0,n,.06)},
 sfx(name){const c=this.ctx;if(!c)return;const t=c.currentTime;
  switch(name){
   case 'beep':this.note(440,t,.16,'square',.25);break;
   case 'go':this.note(880,t,.5,'square',.28);break;
   case 'crash':this.nz(.35,.7,'lowpass',900);this.note(160,t,.3,'square',.3,null,40);break;
   case 'bump':this.nz(.15,.45,'lowpass',1200);this.note(220,t,.12,'square',.2,null,80);break;
   case 'pothole':this.nz(.28,.6,'lowpass',500);this.note(90,t,.25,'triangle',.4,null,30);break;
   case 'crate':this.nz(.25,.8,'bandpass',1200);this.note(140,t,.2,'square',.3,null,60);break;
   case 'turbo':this.note(180,t,.6,'sawtooth',.22,null,1100);this.nz(.5,.25,'bandpass',2000);break;
   case 'lap':[660,880,1320].forEach((f,i)=>this.note(f,t+i*.08,.18,'square',.2));break;
   case 'boom':this.nz(1.2,.95,'lowpass',600);this.note(110,t,1.1,'sawtooth',.4,null,25);break;
   case 'respawn':[330,440,660,880].forEach((f,i)=>this.note(f,t+i*.06,.12,'triangle',.25));break;
   case 'finish':[523,659,784,1047,784,1047,1319].forEach((f,i)=>this.note(f,t+i*.13,.22,'square',.22));break;
   case 'select':this.note(660,t,.07,'square',.18);break;
   case 'start':[392,523,659,784].forEach((f,i)=>this.note(f,t+i*.07,.14,'square',.2));break;
  }},
 toggle(){this.muted=!this.muted;if(this.master)this.master.gain.value=this.muted?0:0.5}
};

function spawn(x,y,n,cols,sp,life,size,grav=140){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=sp*(.3+Math.random());
    PARTS.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-sp*.3,l:life*(.5+Math.random()*.5),m:life,
      c:cols[Math.floor(Math.random()*cols.length)],s:size,g:grav})}}
function spawnSmoke(x,y,intensity=1){
  for(let i=0;i<intensity;i++){
    PARTS.push({
      x:x+(Math.random()-0.5)*14,
      y:y-Math.random()*4,
      vx:(Math.random()-0.5)*18,
      vy:-20-Math.random()*25,
      l:0.8+Math.random()*0.6,
      m:1.2,
      c:['#555555','#777777','#999999','#bbbbbb','#dddddd'][Math.floor(Math.random()*5)],
      s:2+Math.floor(Math.random()*2.5),
      g:-10
    });
  }
}
function updParts(dt){
  for(let i=PARTS.length-1;i>=0;i--){
    const p=PARTS[i];p.l-=dt;if(p.l<=0){PARTS.splice(i,1);continue}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g!==undefined?p.g:140)*dt;
  }
}

/* ---------------------------------------------------------------------
   IA dos Rivais
   --------------------------------------------------------------------- */
function updateCars(dt,live){
  for(const c of CARS){
    c.laneCd-=dt;c.hitCd-=dt;
    if(!live&&mode==='countdown')continue;
    const curve=Math.abs(curveAt(c.z+250));
    let tv=c.vmax*(1-Math.min(.1,curve*.03));
    const gap=c.z-S.z;
    if(gap>3000)tv*=.92;else if(gap<-2000)tv*=1.07;
    // Trânsito
    let blk=null,bd=400;
    for(const o of CARS){if(o===c)continue;const dz=o.z-c.z;if(dz>0&&dz<bd&&Math.abs(o.lat-c.lat)<.5){bd=dz;blk=o}}
    const pd=S.z-c.z;if(pd>0&&pd<bd&&Math.abs(S.x-c.lat)<.5){bd=pd;blk={v:S.speed}}
    if(blk){
      tv=Math.min(tv,blk.v*(bd<120?.9:1));
      if(c.laneCd<=0){let best=null,bdist=9;
        for(const L of LANES){if(Math.abs(L-c.lat)<.2)continue;let free=true;
          for(const o of CARS){if(o===c)continue;const dz=o.z-c.z;if(dz>-140&&dz<420&&Math.abs(o.lat-L)<.5){free=false;break}}
          if(free){const dzp=S.z-c.z;if(dzp>-140&&dzp<420&&Math.abs(S.x-L)<.5)free=false}
          if(free){const dd=Math.abs(L-c.lat);if(dd<bdist){bdist=dd;best=L}}}
        if(best!==null){c.tl=best;c.laneCd=1.2+Math.random()}else c.laneCd=.3}
    }else if(c.laneCd<=0&&Math.random()<dt*.15){c.tl=LANES[Math.floor(Math.random()*4)];c.laneCd=2}
    c.v+=clamp(tv-c.v,-110*dt,55*dt);
    c.lat+=clamp(c.tl-c.lat,-.9*dt,.9*dt);c.lat=clamp(c.lat,-.85,.85);
    c.z+=c.v*SP*dt;
    if(!c.fin&&c.z>=LAPS*TRACK_LEN){c.fin=true;c.finT=S.time}
  }
}

const KEYS={};const K_=c=>!!KEYS[c];

function crash(dmg,sfx){

function finishRace(){
  mode='finish';S.finT=0;S.finTime=S.time;S.place=1+CARS.filter(c=>c.fin).length;
  const key=trackIdx+':'+diff,h=HS[key]||(HS[key]={race:0,lap:0});
  if(!h.race||S.finTime<h.race){h.race=S.finTime;S.newRec=true}

  saveHS();
  saveHallRecord(TRACKS[trackIdx].name, DIFFS[diff].n, S.finTime, S.bestLap);

function physics(dt){
  const racing=mode==='race';
  let thr=0,steer=0,brake=false;
  
  if(S.invuln>0)S.invuln-=dt;
  
  if(S.wrecked){
    S.speed=0;
    S.dead+=dt;
    if(Math.random()<0.85) spawnSmoke(W/2+(Math.random()-0.5)*12, 172, 2);
    return;
  }

  if(racing){
    thr=(K_('ArrowUp')||K_('KeyW'))?1:0;brake=K_('ArrowDown')||K_('KeyS');
    steer=((K_('ArrowRight')||K_('KeyD'))?1:0)-((K_('ArrowLeft')||K_('KeyA'))?1:0);
  } else if(mode==='finish'){
    steer=clamp(-S.x*2,-.6,.6);
  }
  S.thr=thr;S.brake=brake;
  if(S.turboT>0)S.turboT-=dt;
  const turbo=S.turboT>0,cap=turbo?256:MAXV;
  S.offroad=Math.abs(S.x)>1.08;

  if(thr)S.speed+=(turbo?150:72)*dt*(S.speed<cap?1:0);
  else if(turbo)S.speed+=150*dt*(S.speed<cap?1:0);
  else S.speed-=(mode==='finish'?18:34)*dt;
  if(brake)S.speed-=170*dt;
  if(S.speed>cap)S.speed-=70*dt;
  if(S.offroad&&S.speed>95)S.speed-=130*dt;
  S.speed=Math.max(mode==='finish'?85:0,S.speed);

  const ds=S.speed/MAXV;
  S.steer+=(steer-S.steer)*Math.min(1,dt*10);
  S.x+=S.steer*dt*2.4*clamp(S.speed/110,.1,1);
  S.x-=curveAt(S.z+40)*ds*dt*.7;
  if(racing&&Math.abs(S.steer)>.5&&ds>.6)S.speed-=14*dt*ds;
  S.x=clamp(S.x,-2.4,2.4);
  S.z+=S.speed*SP*dt;
  
  S.skyX+=curveAt(S.z)*ds*dt*55 + S.steer*dt*20;
  const targetCamY = hillAt(S.z+200)*9 + (Math.sin(S.t*22)*1.2*ds);
  S.camY += (targetCamY - S.camY) * Math.min(1, dt*6);

  S.hitCd-=dt;S.shake=Math.max(0,S.shake-dt*1.6);
  
  if(S.power<35 && Math.random()<0.4){
    spawnSmoke(W/2+(Math.random()-0.5)*8, 172, 1);
  }

  if(S.offroad&&racing){
    S.power-=2.5*dt;S.shake=Math.max(S.shake,.14);
    if(Math.random()<.5)spawn(W/2+(S.x>0?20:-20),178,1,['#6a5030','#8a7048'],50,.4,2);
    if(S.power<=0){S.power=0;destroyCar()}
  }

  if(racing){
    S.time+=dt;S.lapTime+=dt;
    
    // Colisão com postes e laterais da pista
    if(S.hitCd<=0 && S.invuln<=0)for(const o of OBJS){
      if(!o.solid||o.hit)continue;
      const rel=((o.z-S.z+TRACK_LEN/2)%TRACK_LEN+TRACK_LEN)%TRACK_LEN-TRACK_LEN/2;
      if(rel>-6&&rel<14&&Math.abs(o.x-S.x)<.22){
        o.hit=true;S.x-=Math.sign(o.x)*.3;
        crash(12+S.speed*.06);
        break;
      }
    }

    // Colisão com adversários
    for(const c of CARS){
      const rel=c.z-S.z;
      if(c.hitCd<=0 && S.invuln<=0 && rel>-8 && rel<12 && Math.abs(c.lat-S.x)<.42){
        c.hitCd=.8;const dv=Math.abs(S.speed-c.v),sg=(S.x>=c.lat?1:-1);
        S.x+=sg*.14;c.tl=c.lat=clamp(c.lat-sg*.25,-.85,.85);
        if(S.speed>c.v){S.speed=c.v*.85;c.v+=18}else c.v*=.9;
        crash(4+dv*.09,'bump');
        spawn(W/2+sg*10,165,10,['#ffffff','#ffd23f'],90,.35,2);
      }
    }
    // Voltas
    if(S.z>=(S.lapDone+1)*TRACK_LEN){
      S.laps[S.lapDone]=S.lapTime;if(!S.bestLap||S.lapTime<S.bestLap)S.bestLap=S.lapTime;
      S.lapDone++;S.lapTime=0;
      if(S.lapDone>=LAPS)finishRace();
      else{AU.sfx('lap');S.msg=S.lapDone===LAPS-1?'FINAL LAP!':'LAP '+(S.lapDone+1);S.msgT=2}
    }
  }
  if(mode==='finish')S.finT+=dt;
}

/* ---------------------------------------------------------------------
   Atualização do Jogo
   --------------------------------------------------------------------- */
function update(dt){
  if(paused)return;
  if(mode==='user_prompt'||mode==='hall')return;

  S.t+=dt;
  if(S.msgT>0)S.msgT-=dt;
  updParts(dt);

  if(mode==='title'||mode==='select'){
    S.speed=140;S.z+=S.speed*SP*dt;S.x=Math.sin(S.t*.6)*.3;
    S.skyX+=curveAt(S.z)*.6*dt*55;updateCars(dt,true);AU.engine(0,0,false);return;
  }
  if(mode==='countdown'){
    S.cd-=dt;const n=Math.ceil(S.cd)-1;
    if(n!==S.cdLast&&n>=1){AU.sfx('beep')}S.cdLast=n;
    AU.engine(40+(S.cd<2?60:0),1,true);
    if(S.cd<=1){mode='race';S.msg='GO!';S.msgT=1;AU.sfx('go')}
    return;
  }
  physics(dt);
  updateCars(dt,true);
  if(mode==='race'||mode==='finish'||S.wrecked)
    S.place=mode==='finish'?S.place:1+CARS.filter(c=>c.z>S.z).length;
  AU.engine(S.speed,S.thr,!S.wrecked);
}

/* ---------------------------------------------------------------------
   Renderização do Mundo 3D
   --------------------------------------------------------------------- */
const RC0=new Float32Array(ROAD_H+2),ZROW=new Float32Array(ROAD_H+2);
for(let i=1;i<=ROAD_H;i++)ZROW[i]=K/i;
const FOG=[.22,.34,.48,.64,.82,1];

function computeRows(){
  let dxw=0,xw=0,zp=0;
  for(let i=ROAD_H;i>=1;i--){
    const z=ZROW[i],dz=z-zp;
    dxw+=curveAt(S.z+z)*dz;
    xw+=dxw*dz;
    zp=z;
    RC0[i]=W/2+xw*CK2*i*RWK;
  }
}

function renderWorld(showPlayer){
  const tr=TRACKS[trackIdx],th=THEMES[tr.theme];
  const horY = Math.round(BASE_HOR + S.camY);

  g.save();
  if(S.shake>0)g.translate(Math.round((Math.random()-.5)*S.shake*8),Math.round((Math.random()-.5)*S.shake*8));
  
  g.drawImage(scene.sky,0,Math.round(S.camY*0.5));
  tile(scene.far,S.skyX*.45,S.camY*0.7);
  tile(scene.near,S.skyX,S.camY*0.9);

  g.fillStyle=th.glow;for(let k=0;k<3;k++)g.fillRect(0,horY-3-k*3,W,3);

  computeRows();

  for(let i=ROAD_H;i>=1;i--){
    const y=horY+i-1;
    if(y<horY||y>=HUD_Y)continue;
    const half=i*RWK,c=RC0[i]-S.x*half;
    const f=FOG[Math.min(5,Math.floor(i/ROAD_H*6))];
    const wz=S.z+ZROW[i],dz=ZROW[i]-(i<ROAD_H?ZROW[i+1]:0);
    let band=Math.floor(wz/60)&1;if(dz>30)band=2;

    px(0,y,W,1,shade(th.gndC[band],f));
    const rw=Math.max(1,half*.1);
    px(c-half-rw,y,rw,1,shade(th.rumC[band],f));px(c+half,y,rw,1,shade(th.rumC[band],f));
    px(c-half,y,half*2,1,shade(th.roadC[band],f));

    if(band<2){
      const ew=Math.max(1,half*.03),lw=Math.max(1,half*.025);
      px(c-half*.95,y,ew,1,shade(th.edge,f*.8));px(c+half*.95-ew,y,ew,1,shade(th.edge,f*.8));
      if(band===1){
        px(c-half/3-lw/2,y,lw,1,shade(th.line,f));
        px(c+half/3-lw/2,y,lw,1,shade(th.line,f));
      }
    }
    const m=((wz%TRACK_LEN)+TRACK_LEN)%TRACK_LEN;
    if(m<120){
      const row=Math.floor(m/20),cw=half*.2;
      for(let k=0;k<10;k++)px(c-half+k*cw,y,cw+.6,1,shade(((k+row)&1)?'#ffffff':'#101010',f));
    }
  }

  // Sprites Ordenados por Profundidade
  const items=[];
  for(const o of OBJS){
    let rel=((o.z-S.z)%TRACK_LEN+TRACK_LEN)%TRACK_LEN;
    if(rel>TRACK_LEN-20)rel-=TRACK_LEN;
    const d=rel+30;if(d<22||d>2300)continue;
    items.push({d,o});
  }
  for(const c of CARS){
    const d=c.z-S.z+30;if(d<18||d>2300)continue;
    items.push({d,c});
  }
  items.sort((a,b)=>b.d-a.d);

  const fr=Math.floor(S.t*14)&1;
  for(const it of items){
    const i=K/it.d,ri=clamp(Math.round(i),1,ROAD_H),half=i*RWK,yb=horY+i-1,sf=i/ROAD_H;
    g.globalAlpha=clamp(.25+sf*1.1,.25,1);
    if(it.o){
      const o=it.o,cx=RC0[ri]+(o.x-S.x)*half;
      if(cx>-90&&cx<W+90){
        // Se for caixa destruída não desenha
        if(!o.hit || o.type==='side' || o.type==='pothole'){
          spr(o.spr,cx,yb+1,sf*o.sc);
        }
      }
    }else{
      const c=it.c,cx=RC0[ri]+(c.lat-S.x)*half,s=sf*2.4;
      if(cx>-60&&cx<W+60){
        const w=24*s;
        px(cx-w*.5,yb-Math.max(1,s*.9),w,Math.max(1,s*.9),'rgba(0,0,0,0.65)');
        spr(buildCarBitmap(CAR_ART,c.pal,false,fr,false),cx,yb+1,s);
      }
    }
  }
  g.globalAlpha=1;

  if(showPlayer){
    const blink=(S.invuln>0 || S.hitCd>0) && (Math.floor(S.t*22)&1);
    if(!blink){
      const cx=W/2+Math.round(S.steer*3.5),by=HUD_Y-3;
      const art = S.wrecked ? CAR_DESTROYED_ART : CAR_ART;
      
      if(S.turboT>0 && !S.wrecked){
        for(const dx of[-18,12]){
          px(cx+dx,by-4,6,6+Math.random()*8,'#ffb020');
          px(cx+dx+1,by-4,4,4+Math.random()*5,'#fff6a0');
        }
      }
      spr(buildCarBitmap(art,PALS[0],!!S.brake,fr,S.wrecked),cx,by,2.4);
    }
  }

  if(S.turboT>0&&mode==='race'&&!S.wrecked){
    for(let k=0;k<18;k++){
      const side=Math.random()<.5?-1:1,x=W/2+side*(35+Math.random()*95);
      px(x,horY+10+Math.random()*80,1,5+Math.random()*12,'rgba(255,255,255,0.75)');
    }
  }

  for(const p of PARTS){
    g.globalAlpha=clamp(p.l/p.m*1.5,0,1);
    px(p.x,p.y,p.s,p.s,p.c);
  }
  g.globalAlpha=1;
  g.restore();
}

function arrow(cx,cy,dir,big,col){
  const sc=big?2:1;
  px(dir>0?cx-6*sc:cx,cy-sc,6*sc,3*sc,col);
  for(let k=0;k<6;k++){const h=(11-2*k)*sc,xx=dir>0?cx+k*sc:cx-(k+1)*sc;px(xx,cy+sc/2-h/2,sc,h,col)}
}

function drawHUD(){
  px(0,HUD_Y,W,H-HUD_Y,'#031209');px(0,HUD_Y,W,2,'#1fd060');px(0,HUD_Y+2,W,1,'#0a5a2a');
  
  for(let i=0;i<3;i++){
    const y=HUD_Y+8+i*9;let t=0,col='#2a7a46';
    if(i<S.lapDone){t=S.laps[i];col='#3f8'}else if(i===S.lapDone&&mode!=='finish'){t=S.lapTime;col='#fff'}
    text('LAP'+(i+1),6,y,i===Math.min(S.lapDone,2)?'#ffd23f':'#2a7a46');text(fmt(t),30,y,col);
  }

  const nc=curveAt(S.z+1600);
  px(68,HUD_Y+6,34,26,'#02260f');
  const acol=Math.abs(nc)>1.8?'#ff5030':'#3f8';

  } else {
    arrow(85,HUD_Y+19,nc>0?1:-1,Math.abs(nc)>1.8,acol);
  }

  text(String(Math.floor(S.speed)).padStart(3,' '),106,HUD_Y+8,'#3ff',3,'#064');

  const gear=clamp(1+Math.floor(S.speed/46),1,5);text('G'+gear,144,HUD_Y+8,'#ffd23f');
  const gf=clamp((S.speed-(gear-1)*46)/46,0,1),lit=Math.round(gf*14);
  for(let i=0;i<14;i++)px(106+i*5,HUD_Y+28,4,5,i<lit?(i<9?'#3f8':i<12?'#ffd23f':'#ff3030'):'#06361a');

  text('POWER',188,HUD_Y+8,S.power<30?'#ff3030':'#3f8');
  const pl=Math.ceil(S.power/10),pc=S.power<30?'#ff3030':S.power<60?'#ffd23f':'#3f8';

  text('TURBO',188,HUD_Y+26,'#3f8');
  for(let i=0;i<3;i++)px(220+i*9,HUD_Y+26,7,5,i<S.turbo?'#ff9020':'#06361a');
}

/* ---------------------------------------------------------------------
   Entrada de Teclado
   --------------------------------------------------------------------- */
addEventListener('keydown',e=>{
  AU.init();if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume();
  
  // Tratamento específico da tela de entrada do Username
  if(mode==='user_prompt'){
    if(e.key==='Enter'){
      if(nameInput.trim().length > 0){
        currentUser = nameInput.trim().toUpperCase().slice(0,10);
        localStorage.setItem('turbonights_user', currentUser);
        mode = 'title';
        AU.sfx('select');
      }
    }else if(e.key==='Backspace'){
      nameInput = nameInput.slice(0,-1);
    }else if(e.key.length===1 && nameInput.length < 10){
      if(/[a-zA-Z0-9_\- ]/.test(e.key)){
        nameInput += e.key.toUpperCase();
      }
    }
    return;
  }

  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  KEYS[e.code]=true;if(e.repeat)return;
  const c=e.code;

  if(c==='KeyM'){AU.toggle();return}
  if(c==='KeyF'){const w=document.getElementById('wrap');if(document.fullscreenElement)document.exitFullscreen();else if(w.requestFullscreen)w.requestFullscreen();return}
  if(c==='KeyP'&&(mode==='race'||mode==='countdown')){paused=!paused;return}
  if(paused)return;

  // Ver Hall da Fama
  if(c==='KeyH' && (mode==='title'||mode==='select'||mode==='finish')){
    mode='hall';
    AU.sfx('select');
    return;
  }
  if(mode==='hall'){
    if(c==='Escape'||c==='Enter'||c==='Space'){mode='title';AU.sfx('select')}
    return;
  }

  // Trocar usuário
  if(c==='KeyU' && mode==='title'){
    nameInput = currentUser;
    mode = 'user_prompt';
    AU.sfx('select');
    return;
  }

  // Respawn se o carro estiver destruído
  if(S && S.wrecked && (c==='KeyR'||c==='Space'||c==='Enter')){
    quickRespawn();
    return;
  }

  if(mode==='title'){
    if(c==='Enter'||c==='Space'){mode='select';AU.sfx('select')}
  }
  else if(mode==='select'){
    if(c==='ArrowRight'||c==='KeyD'){loadTrack((trackIdx+1)%TRACKS.length);AU.sfx('select')}
    else if(c==='ArrowLeft'||c==='KeyA'){loadTrack((trackIdx+TRACKS.length-1)%TRACKS.length);AU.sfx('select')}
    else if(c==='ArrowUp'||c==='KeyW'){diff=(diff+DIFFS.length-1)%DIFFS.length;AU.sfx('select')}
    else if(c==='ArrowDown'||c==='KeyS'){diff=(diff+1)%DIFFS.length;AU.sfx('select')}
    else if(c==='Enter'||c==='Space')startRace();
    else if(c==='Escape')mode='title';
  }
  else if(mode==='race'){
    if(c==='Space'&&S.turbo>0&&S.turboT<=0&&S.speed>40&&!S.wrecked){
      S.turbo--;S.turboT=2.4;AU.sfx('turbo');
    }
    else if(c==='Escape'){loadTrack(trackIdx);mode='select'}
  }
  else if(mode==='countdown'){
    if(c==='Escape'){loadTrack(trackIdx);mode='select'}
  }
  else if(mode==='finish'){
    if(S.finT>1.2){
      if(c==='Enter'){loadTrack(trackIdx);mode='select'}
      else if(c==='KeyR')startRace();
    }
    if(c==='Escape'){loadTrack(trackIdx);mode='select'}
  }
});
addEventListener('keyup',e=>{KEYS[e.code]=false});
addEventListener('blur',()=>{if(mode==='race'||mode==='countdown')paused=true});

/* ---------------------------------------------------------------------
   Inicialização
   --------------------------------------------------------------------- */
loadTrack(0);
let last=performance.now();
function frame(n){const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);render();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
</body>
</html>
